name: Feature
description: Propose or implement a Sitometron capability
title: ""
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase and Gate Issue
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Reference documents and applicable sections
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirement IDs or N/A
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: Target files or components
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contract Registry rows and transitions or N/A
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: ADR required?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a verifiable checklist. Design scope may evolve until owner freeze; implementation scope freezes when work starts.
    validations:
      required: true
  - type: checkboxes
    id: provenance
    attributes:
      label: Clean-room confirmation
      options:
        - label: This Issue contains no proprietary implementation material.
          required: true
