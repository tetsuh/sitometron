name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Validate schema tooling
        env:
          UV_LINK_MODE: copy
        run: |
          uv sync --frozen --only-group schema
          uv run --frozen --only-group schema python -m unittest discover -s tests/tooling -p 'test_*.py' -v
      - name: Validate core contracts
        run: uv run --frozen --only-group schema python tools/validate_core_contract.py
      - name: Check out exact event head for secret scanning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: secret-scan-head-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run pinned Gitleaks secret scan on the exact event head
        env:
          TMPDIR: ${{ runner.temp }}
          SECRET_SCAN_EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SECRET_SCAN_CHECKOUT: secret-scan-head-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SECRET_SCAN_EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          uv run --frozen --only-group schema python tools/run_secret_scan.py \
            --repository "$GITHUB_WORKSPACE/$SECRET_SCAN_CHECKOUT" \
            --expected-head "$SECRET_SCAN_EXPECTED_HEAD"
      - name: Remove exact event-head secret-scan checkout
        if: always()
        env:
          SECRET_SCAN_CHECKOUT: secret-scan-head-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf "$GITHUB_WORKSPACE/$SECRET_SCAN_CHECKOUT"
      - name: Resolve vcpkg cache identity
        id: vcpkg-cache-identity
        run: |
          set -euo pipefail
          if [[ -z "${ImageOS:-}" || -z "${ImageVersion:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          identity="${ImageOS}-${ImageVersion}"
          identity="${identity//[^a-zA-Z0-9._-]/-}"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "value=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg filesystem binary cache
        if: steps.vcpkg-cache-identity.outputs.available == 'true'
        id: vcpkg-binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-files-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg-cache-identity.outputs.value }}
          restore-keys: |
            vcpkg-files-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-files-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json') }}
      - name: Configure vcpkg filesystem binary cache
        run: |
          if [[ '${{ steps.vcpkg-cache-identity.outputs.available }}' == 'true' ]]; then
            mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"
          else
            echo "VCPKG_BINARY_SOURCES=clear" >> "$GITHUB_ENV"
          fi
      - name: Read repository-owned vcpkg tool pin
        id: vcpkg-pin
        run: |
          set -euo pipefail
          pin="$(cat tools/vcpkg-tool-commit.txt)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "value=$pin" >> "$GITHUB_OUTPUT"
      - name: Run deterministic Bash bootstrap contract
        run: bash tests/tooling/bootstrap_sh_test.sh
      - name: Run canonical Linux bootstrap
        run: ./bootstrap.sh
      - name: Run clang-tidy 18.1.3
        run: |
          set -euo pipefail
          clang_tidy="$(command -v clang-tidy-18)"
          [[ "$clang_tidy" == /* && -x "$clang_tidy" ]]
          uv run --frozen --only-group schema python tools/run_clang_tidy.py \
            --clang-tidy "$clang_tidy"
      - name: Run Linux ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --preset asan-ubsan \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.cache/vcpkg/x64-linux/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg-installed/x64-linux" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_APPLOCAL_DEPS=OFF
          cmake --build --preset asan-ubsan
          ctest --test-dir build/dev-linux --show-only=json-v1 > "$RUNNER_TEMP/dev-tests.json"
          ctest --test-dir build/asan-ubsan --show-only=json-v1 > "$RUNNER_TEMP/asan-tests.json"
          uv run --frozen --only-group schema python - \
            "$RUNNER_TEMP/dev-tests.json" "$RUNNER_TEMP/asan-tests.json" <<'PY'
          import json
          import sys

          def names(path):
              with open(path, encoding="utf-8") as stream:
                  return [test["name"] for test in json.load(stream)["tests"]]

          development = names(sys.argv[1])
          sanitized = names(sys.argv[2])
          if len(development) != 36 or len(development) != len(set(development)):
              raise SystemExit(f"expected 36 unique dev-linux CTests; found {len(development)}")
          if len(sanitized) != len(set(sanitized)) or set(development) != set(sanitized):
              raise SystemExit("ASan/UBSan CTest name set differs from dev-linux")
          print(f"ASan/UBSan CTest parity: {len(sanitized)} tests")
          PY
          ctest --preset asan-ubsan
      - name: Verify direct installed-port closure
        run: |
          set -euo pipefail
          installed="$(.cache/vcpkg/x64-linux/vcpkg list --x-install-root="$GITHUB_WORKSPACE/build/vcpkg-installed/x64-linux")"
          printf '%s\n' "$installed"
          for port in nlohmann-json boost-uuid boost-hash2; do grep -Eq "^${port}:x64-linux[[:space:]]" <<<"$installed"; done
      - name: Format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Save vcpkg filesystem binary cache
        if: success() && steps.vcpkg-cache-identity.outputs.available == 'true' && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Validate schema tooling
        env:
          UV_LINK_MODE: copy
        shell: pwsh
        run: |
          uv sync --frozen --only-group schema
          uv run --frozen --only-group schema python -m unittest discover -s tests/tooling -p 'test_*.py' -v
      - name: Validate core contracts
        run: uv run --frozen --only-group schema python tools/validate_core_contract.py
      - name: Resolve vcpkg cache identity
        id: vcpkg-cache-identity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $identity = "$($env:ImageOS)-$($env:ImageVersion)" -replace '[^A-Za-z0-9._-]', '-'
          'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "value=$identity" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore vcpkg filesystem binary cache
        if: steps.vcpkg-cache-identity.outputs.available == 'true'
        id: vcpkg-binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-files-v2-${{ runner.os }}-${{ runner.arch }}-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg-cache-identity.outputs.value }}
          restore-keys: |
            vcpkg-files-v2-${{ runner.os }}-${{ runner.arch }}-x64-windows-${{ hashFiles('vcpkg.json') }}-
            vcpkg-files-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-${{ hashFiles('vcpkg.json') }}
      - name: Configure vcpkg filesystem binary cache
        shell: pwsh
        run: |
          if ('${{ steps.vcpkg-cache-identity.outputs.available }}' -eq 'true') {
            $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
            New-Item -ItemType Directory -Path $cache -Force | Out-Null
            $cache = $cache.Replace('\', '/')
            "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            'VCPKG_BINARY_SOURCES=clear' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Resolve MSVC and run canonical Windows bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pin = (Get-Content tools/vcpkg-tool-commit.txt -Raw).Trim()
          if ($pin -notmatch '^[0-9a-f]{40}$') { throw 'invalid repository-owned vcpkg tool pin' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -property installationPath
          Import-Module "$install\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          & "$env:GITHUB_WORKSPACE\tests\tooling\bootstrap_ps1_test.ps1"
          & "$env:GITHUB_WORKSPACE\bootstrap.ps1"
      - name: Verify direct installed-port closure and z-applocal boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installed = & "$env:GITHUB_WORKSPACE\.cache\vcpkg\x64-windows\vcpkg.exe" list --x-install-root="$env:GITHUB_WORKSPACE\build\vcpkg-installed\x64-windows"
          $installed | Write-Output
          foreach ($port in 'nlohmann-json', 'boost-uuid', 'boost-hash2') { if (-not ($installed -match "^$([regex]::Escape($port)):x64-windows\s")) { throw "expected direct port is absent: $port" } }
          $buildNinja = "$env:GITHUB_WORKSPACE/build/dev-windows/build.ninja"
          if (-not (Test-Path -LiteralPath $buildNinja -PathType Leaf)) { throw "readable build.ninja is missing: $buildNinja" }
          if (-not (Select-String -LiteralPath $buildNinja -Pattern 'z-applocal' -Quiet -ErrorAction Stop)) { return }
          throw 'project build still invokes vcpkg z-applocal'
      - name: Save vcpkg filesystem binary cache
        if: success() && steps.vcpkg-cache-identity.outputs.available == 'true' && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}
